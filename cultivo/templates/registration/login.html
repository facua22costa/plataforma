{% extends "cultivo/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="panel-bloque login">
  <h1>Ingresar</h1>
  <form method="post" class="formulario">{% csrf_token %}
    {% if form.errors %}<p class="errorlist">Usuario o contraseña incorrectos.</p>{% endif %}
    <div><label for="id_username">Usuario</label>{{ form.username }}</div>
    <div><label for="id_password">Contraseña</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primario">Ingresar</button>
  </form>
</div>
{% endblock %}
